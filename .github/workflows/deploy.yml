name: Deploy to NuGet

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0 or 1.0.0-alpha). Leave empty to use Directory.Build.props version.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.nuget.org/packages/OakIdeas.GenericRepository

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Get all history for proper versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4
      with:
        useConfigFile: true
        configFilePath: src/GitVersion.yml

    - name: Display GitVersion outputs
      run: |
        echo "Major: ${{ steps.gitversion.outputs.major }}"
        echo "Minor: ${{ steps.gitversion.outputs.minor }}"
        echo "Patch: ${{ steps.gitversion.outputs.patch }}"
        echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
        echo "PreReleaseTagWithDash: ${{ steps.gitversion.outputs.preReleaseTagWithDash }}"
        echo "PreReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}"
        echo "PreReleaseNumber: ${{ steps.gitversion.outputs.preReleaseNumber }}"
        echo "WeightedPreReleaseNumber: ${{ steps.gitversion.outputs.weightedPreReleaseNumber }}"
        echo "BuildMetaData: ${{ steps.gitversion.outputs.buildMetaData }}"
        echo "FullBuildMetaData: ${{ steps.gitversion.outputs.fullBuildMetaData }}"
        echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
        echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
        echo "AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
        echo "AssemblySemFileVer: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
        echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
        echo "BranchName: ${{ steps.gitversion.outputs.branchName }}"
        echo "EscapedBranchName: ${{ steps.gitversion.outputs.escapedBranchName }}"
        echo "Sha: ${{ steps.gitversion.outputs.sha }}"
        echo "ShortSha: ${{ steps.gitversion.outputs.shortSha }}"
        echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
        echo "CommitDate: ${{ steps.gitversion.outputs.commitDate }}"

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./src

    - name: Build
      run: |
        if [ -n "${{ steps.version.outputs.version }}" ]; then
          echo "Building with version: ${{ steps.version.outputs.version }}"
          dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}
        else
          echo "Building with version from Directory.Build.props"
          dotnet build --configuration Release --no-restore
        fi
      working-directory: ./src

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: ./src

    - name: Generate nuget packages
      run: |
        if [ -n "${{ steps.version.outputs.version }}" ]; then
          echo "Packing with version: ${{ steps.version.outputs.version }}"
          dotnet pack --configuration Release --no-build -o nupkg /p:Version=${{ steps.version.outputs.version }}
        else
          echo "Packing with version from Directory.Build.props"
          dotnet pack --configuration Release --no-build -o nupkg
        fi
      working-directory: ./src

    - name: List generated packages
      run: |
        echo "Generated NuGet packages:"
        ls -la *.nupkg
      working-directory: ./src/nupkg

    - name: Publish nuget packages
      run: |
        for pkg in *.nupkg; do
          echo "Publishing $pkg"
          dotnet nuget push "$pkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
        done
      working-directory: ./src/nupkg
