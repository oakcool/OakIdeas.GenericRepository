name: Deploy to NuGet

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0 or 1.0.0-alpha). Leave empty to use Directory.Build.props version.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.nuget.org/packages/OakIdeas.GenericRepository

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Get all history for proper versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v1.1.1
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v1.1.1
      with:
        useConfigFile: true
        configFilePath: src/GitVersion.yml

    - name: Extract version from tag or input
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          # Manual workflow dispatch with version input (highest priority)
          VERSION="${{ github.event.inputs.version }}"
          echo "? Using manually specified version: $VERSION"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # Tag push - extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "? Extracted version from git tag: $VERSION"
        elif [ -n "${{ steps.gitversion.outputs.semVer }}" ]; then
          # Use GitVersion calculated version (automatic increment)
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          echo "? Using GitVersion calculated version: $VERSION"
          echo "  - Base Version: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "  - Pre-release: ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "  - Commits since version: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
        else
          # Fallback to Directory.Build.props
          echo "? Using version from Directory.Build.props (fallback)"
          VERSION=""
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "?? Final version to use: ${VERSION:-'from Directory.Build.props'}"

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./src

    - name: Build
      run: |
        if [ -n "${{ steps.version.outputs.version }}" ]; then
          echo "Building with version: ${{ steps.version.outputs.version }}"
          dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }}
        else
          echo "Building with version from Directory.Build.props"
          dotnet build --configuration Release --no-restore
        fi
      working-directory: ./src

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: ./src

    - name: Generate nuget packages
      run: |
        if [ -n "${{ steps.version.outputs.version }}" ]; then
          echo "Packing with version: ${{ steps.version.outputs.version }}"
          dotnet pack --configuration Release --no-build -o nupkg /p:Version=${{ steps.version.outputs.version }}
        else
          echo "Packing with version from Directory.Build.props"
          dotnet pack --configuration Release --no-build -o nupkg
        fi
      working-directory: ./src

    - name: List generated packages
      run: |
        echo "Generated NuGet packages:"
        ls -la *.nupkg
      working-directory: ./src/nupkg

    - name: Publish nuget packages
      run: |
        for pkg in *.nupkg; do
          echo "Publishing $pkg"
          dotnet nuget push "$pkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
        done
      working-directory: ./src/nupkg
